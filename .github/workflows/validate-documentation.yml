name: AKR Documentation Validation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'modules.yaml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'modules.yaml'

# ---------------------------------------------------------------------------
# Version pinning
# Override CORE_AKR_TEMPLATES_REF in your repo's workflow env or via
# repository variable to pin to a specific release tag.
# Default: main (always latest — suitable for pilot mode repos)
# Production mode recommendation: pin to a release tag, e.g. v1.2.0
# ---------------------------------------------------------------------------
env:
  CORE_AKR_TEMPLATES_REF: main

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  validate-documentation:
    name: Validate AKR Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch core-akr-templates at runtime
        # Authentication: GITHUB_TOKEN provides read access to public repos and
        # to private repos within the same GitHub org/installation.
        # If core-akr-templates is private and in a different org, add a
        # repository secret named AKR_READ_PAT with repo:read scope and use it below.
        #
        # Pinning: Set CORE_AKR_TEMPLATES_REF env var (top of this file) to a
        # release tag (e.g. v1.2.0) for production compliance mode repos.
        # Default 'main' gives latest — acceptable for pilot mode.
        run: |
          CLONE_URL="https://github.com/reyesmelvinr-emr/core-akr-templates.git"

          # Use the workflow token for read access.
          # If cross-org private repo access is needed, switch this to a PAT secret in that repo.
          AUTH_URL="https://x-access-token:${{ github.token }}@${CLONE_URL#https://}"

          git clone \
            --depth 1 \
            --branch "${{ env.CORE_AKR_TEMPLATES_REF }}" \
            "$AUTH_URL" \
            ~/.akr/templates

          echo "✓ core-akr-templates@${{ env.CORE_AKR_TEMPLATES_REF }} fetched"
          echo "  Validator: ~/.akr/templates/.akr/scripts/validate_documentation.py"
          echo "  Vale rules: ~/.akr/templates/.akr/vale-rules/"
          echo "  Parser:     ~/.akr/templates/.akr/scripts/parse_template_directives.py"

      - name: Install Vale
        run: |
          wget -q \
            https://github.com/errata-ai/vale/releases/download/v2.29.0/vale_2.29.0_Linux_64-bit.tar.gz
          tar -xzf vale_2.29.0_Linux_64-bit.tar.gz
          sudo mv vale /usr/local/bin/
          vale --version

      - name: Install Python dependencies
        run: pip install --no-cache-dir pyyaml

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            docs/**/*.md
            modules.yaml

      - name: Assert validator constant sync
        # Runs test_constants_sync.py to verify that VALID_LAYERS, VALID_PROJECT_TYPES,
        # etc. are identical between akr_inline_validate.py and validate_documentation.py.
        # Fails fast with a clear message if drift is detected.
        run: |
          SYNC_TEST=~/.akr/templates/.akr/scripts/tests/test_constants_sync.py

          # Resolve the inline validator path — it's distributed to the app repo
          INLINE_VALIDATOR=.github/skills/akr-docs/scripts/akr_inline_validate.py

          if [ -f "$SYNC_TEST" ] && [ -f "$INLINE_VALIDATOR" ]; then
            # Override paths for this repo's layout
            INLINE_VALIDATOR_PATH="$(pwd)/$INLINE_VALIDATOR" \
            FULL_VALIDATOR_PATH="$HOME/.akr/templates/.akr/scripts/validate_documentation.py" \
            python "$SYNC_TEST" || {
              echo "::error::Shared constants are out of sync between inline and full validators."
              echo "::error::See CONSTANTS_VERSION in akr_inline_validate.py for the sync protocol."
              exit 1
            }
          else
            echo "::warning::Constant sync test skipped — test file or inline validator not found."
            echo "  Expected: $SYNC_TEST"
            echo "  Expected: $INLINE_VALIDATOR"
          fi

      - name: Determine validation fail mode from modules.yaml
        id: fail-mode
        run: |
          FAIL_ON="never"
          if [ -f modules.yaml ]; then
            MODE=$(python - <<'PY'
          import yaml, sys
          from pathlib import Path
          try:
            data = yaml.safe_load(Path("modules.yaml").read_text(encoding="utf-8")) or {}
            project = data.get("project", {}) if isinstance(data, dict) else {}
            print(project.get("compliance_mode", "pilot") if isinstance(project, dict) else "pilot")
          except Exception:
            print("pilot")
          PY
            )
            if [ "$MODE" = "production" ]; then
              FAIL_ON="needs"
            fi
          fi
          echo "fail_on=$FAIL_ON" >> "$GITHUB_OUTPUT"
          echo "Compliance mode: ${MODE:-unknown} → fail-on: $FAIL_ON"

      - name: Run Vale linter
        id: vale
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          VALE_CONFIG=~/.akr/templates/.akr/.vale.ini

          grep -Eq '^StylesPath\s*=\s*\.akr/vale-rules' "$VALE_CONFIG" || {
            echo "::error::Vale config StylesPath mismatch in fetched templates"
            exit 1
          }

          DOC_FILES=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" \
            | tr ' ' '\n' | grep -E '\.md$' || true)

          if [ -z "$DOC_FILES" ]; then
            echo "No markdown files changed."
            echo '{}' > vale-results.json
            echo "vale_errors=0" >> $GITHUB_OUTPUT
          else
            vale --config "$VALE_CONFIG" $DOC_FILES --output=JSON \
              > vale-results.json 2>&1 || true

            ERRORS=$(jq \
              '[.. | objects | select(has("Severity")) | select(.Severity == "error")] | length' \
              vale-results.json 2>/dev/null || echo "0")
            echo "vale_errors=$ERRORS" >> $GITHUB_OUTPUT
            echo "Vale errors: $ERRORS"
          fi

      - name: Build directive-aware required section list
        # Runs parse_template_directives.py to get the authoritative required sections
        # from template akr: directives. Output is passed to the full validator via
        # an environment variable so it uses the same source of truth as the model.
        # Falls back gracefully if parser is unavailable (pre-directive templates).
        id: directive-sections
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          PARSER=~/.akr/templates/.akr/scripts/parse_template_directives.py
          TEMPLATE_DIR=~/.akr/templates/.akr/templates

          if [ -f "$PARSER" ] && [ -d "$TEMPLATE_DIR" ]; then
            python "$PARSER" --all "$TEMPLATE_DIR" --compact > directive-registry.json 2>/dev/null || true
            echo "directive_registry_available=true" >> "$GITHUB_OUTPUT"
            echo "Directive registry built from templates."
          else
            echo "directive_registry_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Template directive parser not available — validator uses hardcoded section lists."
          fi

      - name: Run AKR documentation validator
        id: akr-validation
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          VALIDATOR=~/.akr/templates/.akr/scripts/validate_documentation.py

          MODULE_ARG=""
          if [ -n "${AKR_MODULE_NAME:-}" ]; then
            MODULE_ARG="--module-name ${AKR_MODULE_NAME}"
          fi

          # Pass directive registry path if available — validator uses it to
          # override hardcoded MODULE_REQUIRED_SECTIONS with template-derived list
          DIRECTIVE_ARG=""
          if [ "${{ steps.directive-sections.outputs.directive_registry_available }}" = "true" ]; then
            DIRECTIVE_ARG="--directive-registry directive-registry.json"
          fi

          export CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}"

          python "$VALIDATOR" \
            --changed-files \
            --output json \
            --fail-on "${{ steps.fail-mode.outputs.fail_on }}" \
            $MODULE_ARG \
            $DIRECTIVE_ARG \
            > akr-results.json || true

          if [ ! -s akr-results.json ]; then
            echo '{"summary":{"total_errors":0,"total_warnings":0,"average_completeness":0},"results":[]}' \
              > akr-results.json
          fi

          TOTAL_ERRORS=$(jq '.summary.total_errors' akr-results.json)
          TOTAL_WARNINGS=$(jq '.summary.total_warnings' akr-results.json)
          AVG_COMPLETENESS=$(jq '.summary.average_completeness' akr-results.json)

          echo "akr_errors=$TOTAL_ERRORS" >> $GITHUB_OUTPUT
          echo "akr_warnings=$TOTAL_WARNINGS" >> $GITHUB_OUTPUT
          echo "completeness=$AVG_COMPLETENESS" >> $GITHUB_OUTPUT
          echo "AKR errors: $TOTAL_ERRORS, warnings: $TOTAL_WARNINGS, completeness: $AVG_COMPLETENESS"

      - name: Create GitHub Check annotation
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const akrResults = fs.existsSync('akr-results.json')
              ? JSON.parse(fs.readFileSync('akr-results.json', 'utf8'))
              : { summary: { total_errors: 0, total_warnings: 0 }, results: [] };

            const valeErrors = parseInt('${{ steps.vale.outputs.vale_errors || 0 }}');
            const akrErrors = parseInt('${{ steps.akr-validation.outputs.akr_errors || 0 }}');
            const totalErrors = valeErrors + akrErrors;
            const conclusion = totalErrors === 0 ? 'success' : 'failure';

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'AKR Documentation Validation',
              head_sha: context.payload.pull_request?.head?.sha || context.sha,
              status: 'completed',
              conclusion,
              output: {
                title: totalErrors === 0
                  ? '✅ Documentation validation passed'
                  : `❌ ${totalErrors} error(s) found`,
                summary: [
                  '### Validation Summary',
                  `- Vale Errors: ${valeErrors}`,
                  `- AKR Errors: ${akrErrors}`,
                  `- AKR Warnings: ${{ steps.akr-validation.outputs.akr_warnings || 0 }}`,
                  `- Average Completeness: ${{ steps.akr-validation.outputs.completeness || 0 }}%`,
                  `- core-akr-templates ref: ${{ env.CORE_AKR_TEMPLATES_REF }}`,
                  `- Directive registry: ${{ steps.directive-sections.outputs.directive_registry_available }}`,
                  totalErrors === 0 ? '✅ All checks passed!' : '❌ Please fix errors before merging.'
                ].join('\n'),
                annotations: akrResults.results
                  .flatMap(r => r.issues
                    .filter(i => i.severity === 'error')
                    .map(i => ({
                      path: r.file_path,
                      start_line: i.line || 1,
                      end_line: i.line || 1,
                      annotation_level: 'failure',
                      message: `[AKR/${i.rule}] ${i.message}`
                    })))
                  .slice(0, 50)
              }
            });

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const akrResults = fs.existsSync('akr-results.json')
              ? JSON.parse(fs.readFileSync('akr-results.json', 'utf8'))
              : { results: [] };

            const valeErrors = parseInt('${{ steps.vale.outputs.vale_errors || 0 }}');
            const akrErrors = parseInt('${{ steps.akr-validation.outputs.akr_errors || 0 }}');
            const akrWarnings = parseInt('${{ steps.akr-validation.outputs.akr_warnings || 0 }}');
            const completeness = parseFloat('${{ steps.akr-validation.outputs.completeness || 0 }}');
            const status = (valeErrors + akrErrors) === 0 ? '✅' : '❌';

            const detailRows = akrResults.results.map(r => {
              const icon = r.valid ? '✅' : '❌';
              const issues = r.issues.length > 0
                ? r.issues.map(i => {
                    const sev = {error:'❌',warning:'⚠️',suggestion:'💡',info:'ℹ️'}[i.severity] || '•';
                    return `  - ${sev} **${i.severity.toUpperCase()}**${i.line ? ` (line ${i.line})` : ''}: ${i.message}`;
                  }).join('\n')
                : '  No issues found';
              return `<details>\n<summary>${icon} <strong>${r.file_path}</strong> (Completeness: ${(r.completeness_score||0).toFixed(2)}%)</summary>\n\n${issues}\n</details>`;
            }).join('\n');

            const comment = [
              `## ${status} AKR Documentation Validation`,
              '',
              '| Metric | Value |',
              '|--------|-------|',
              `| **Vale Errors** | ${valeErrors} |`,
              `| **AKR Errors** | ${akrErrors} |`,
              `| **AKR Warnings** | ${akrWarnings} |`,
              `| **Completeness** | ${completeness.toFixed(2)}% |`,
              `| **Templates ref** | \`${{ env.CORE_AKR_TEMPLATES_REF }}\` |`,
              `| **Status** | ${(valeErrors + akrErrors) === 0 ? '✅ Pass' : '❌ Fail'} |`,
              '',
              detailRows,
              '',
              '---',
              (valeErrors + akrErrors) === 0
                ? '✅ **All validation checks passed!**'
                : '❌ **Please fix errors before merging.**'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c => c.body.includes('AKR Documentation Validation'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            vale-results.json
            akr-results.json
            directive-registry.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail job on errors
        if: |
          steps.vale.outputs.vale_errors > 0 ||
          steps.akr-validation.outputs.akr_errors > 0
        run: |
          echo "❌ Validation failed"
          echo "Vale errors: ${{ steps.vale.outputs.vale_errors }}"
          echo "AKR errors:  ${{ steps.akr-validation.outputs.akr_errors }}"
          exit 1
