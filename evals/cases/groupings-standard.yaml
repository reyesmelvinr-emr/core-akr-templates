id: groupings-standard
description: Validate grouping proposal output structure and max_files compliance
token_budget: 4000
cost_regression_threshold: 1.2
inputs:
  command: /akr-docs groupings TrainingTracker.Api
assertions:
  - modules_yaml_exists
  - modules_have_status_draft
  - modules_max_files_le_8
  - unassigned_has_reason
  - business_capability_pascal_case
