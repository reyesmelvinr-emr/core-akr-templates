project:
  name: TrainingTracker.Api
  layer: API
  standards_version: v1.0.0
  minimum_standards_version: v1.0.0
  compliance_mode: pilot

modules:
  - name: CourseDomain
    grouping_status: approved
    # Set true only with documented rationale - see CHARTER-RESTORATION-PLAN.md override guidance
    ssg_pass3_source_reread: false
    # Set true only with documented rationale - see CHARTER-RESTORATION-PLAN.md override guidance
    ssg_pass4_source_reread: false
    files:
      - path: src/Controllers/CoursesController.cs
        tier: primary
      - path: src/Services/CourseService.cs
        tier: primary
      - path: src/Services/Interfaces/ICourseService.cs
        tier: primary
      - path: src/Repositories/CourseRepository.cs
        tier: primary
      - path: src/Repositories/Interfaces/ICourseRepository.cs
        tier: primary
      - path: src/Contracts/CourseDtos.cs
        tier: primary
    doc_output: docs/modules/CourseDomain_doc.md

  - name: EnrollmentDomain
    grouping_status: draft
    # Set true only with documented rationale - see CHARTER-RESTORATION-PLAN.md override guidance
    ssg_pass3_source_reread: false
    # Set true only with documented rationale - see CHARTER-RESTORATION-PLAN.md override guidance
    ssg_pass4_source_reread: false
    files:
      - path: src/Controllers/EnrollmentsController.cs
        tier: primary
      - path: src/Services/EnrollmentService.cs
        tier: primary
      - path: src/Services/Interfaces/IEnrollmentService.cs
        tier: primary
      - path: src/Repositories/EnrollmentRepository.cs
        tier: primary
      - path: src/Contracts/EnrollmentDtos.cs
        tier: primary
    doc_output: docs/modules/EnrollmentDomain_doc.md

database_objects:
  - name: training.Courses
    type: table
    source: database/tables/training.Courses.sql
    doc_output: docs/database/training.Courses_doc.md
    feature: FN99999_US002
    businessCapability: CourseManagement

unassigned:
  - path: src/Infrastructure/CacheService.cs
    reason: Shared infrastructure utility used by multiple modules
