name: Distribute AKR Business Skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Optional single target repo (owner/repo)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  prepare-matrix:
    name: Prepare Distribution Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3.6.0

      - name: Install matrix dependencies
        run: python -m pip install --no-cache-dir pyyaml

      - name: Determine release tag
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build matrix from registered business repos
        id: matrix
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml

          registered = Path('.github/registered-business-repos.yaml')
          if not registered.exists():
            raise SystemExit('Missing .github/registered-business-repos.yaml')

          cfg = yaml.safe_load(registered.read_text(encoding='utf-8')) or {}
          repos = []
          for item in cfg.get('repositories', []):
            if item.get('enabled', True):
              owner = item.get('owner', '').strip()
              repo = item.get('repo', '').strip()
              if owner and repo:
                repos.append({'owner': owner, 'repo': repo})

          target = os.environ.get('INPUT_TARGET_REPO', '').strip()
          if target:
            if '/' not in target:
              raise SystemExit('workflow_dispatch target_repo must be owner/repo')
            owner, repo = target.split('/', 1)
            if not owner.strip() or not repo.strip():
              raise SystemExit('workflow_dispatch target_repo must be owner/repo')
            repos = [{'owner': owner.strip(), 'repo': repo.strip()}]

          if not repos:
            raise SystemExit('No target repositories enabled for distribution')

          payload = json.dumps({'include': repos})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
            fh.write(f'matrix={payload}\n')
          PY
        env:
          INPUT_TARGET_REPO: ${{ github.event.inputs.target_repo }}

  distribute:
    name: Distribute to ${{ matrix.owner }}/${{ matrix.repo }}
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ secrets.AKR_DISTRIBUTION_PAT }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v3.6.0

      - name: Validate required secret
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::AKR_DISTRIBUTION_PAT secret is not configured."
            exit 1
          fi

      - name: Validate target repository access
        run: |
          set -euo pipefail
          target="${{ matrix.owner }}/${{ matrix.repo }}"
          if ! gh repo view "$target" --json name > /dev/null 2>&1; then
            echo "::error::Repository '$target' not accessible with provided token."
            exit 1
          fi
          echo "Repository '$target' is accessible."

      - name: Clone target repository
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ matrix.owner }}/${{ matrix.repo }}.git" target-repo

      - name: Sync consolidation skill bundle
        id: sync
        run: |
          set -euo pipefail
          cd target-repo
          branch_name="akr-business-skill-update-${{ needs.prepare-matrix.outputs.release_tag }}"
          git checkout -B "$branch_name"

          mkdir -p .github/skills/akr-business-consolidation/scripts

          cp "$GITHUB_WORKSPACE/.github/skills/akr-business-consolidation/SKILL.md" \
             .github/skills/akr-business-consolidation/SKILL.md
          cp "$GITHUB_WORKSPACE/.github/skills/akr-business-consolidation/SKILL-COMPAT.md" \
             .github/skills/akr-business-consolidation/SKILL-COMPAT.md

          cp "$GITHUB_WORKSPACE/.github/skills/akr-business-consolidation/scripts/capability-impact-analysis.md" \
             .github/skills/akr-business-consolidation/scripts/capability-impact-analysis.md
          cp "$GITHUB_WORKSPACE/.github/skills/akr-business-consolidation/scripts/capability-coverage-review.md" \
             .github/skills/akr-business-consolidation/scripts/capability-coverage-review.md
          cp "$GITHUB_WORKSPACE/.github/skills/akr-business-consolidation/scripts/capability-relationship-mapping.md" \
             .github/skills/akr-business-consolidation/scripts/capability-relationship-mapping.md
          cp "$GITHUB_WORKSPACE/.github/skills/akr-business-consolidation/scripts/capability-consolidation.md" \
             .github/skills/akr-business-consolidation/scripts/capability-consolidation.md
          cp "$GITHUB_WORKSPACE/.github/skills/akr-business-consolidation/scripts/capability-test-maintenance.md" \
             .github/skills/akr-business-consolidation/scripts/capability-test-maintenance.md
          cp "$GITHUB_WORKSPACE/.github/skills/akr-business-consolidation/scripts/capability-test-generation.md" \
             .github/skills/akr-business-consolidation/scripts/capability-test-generation.md

          instructions_action="preserved"
          if [ ! -f ".github/copilot-instructions.md" ]; then
            mkdir -p .github
            cp "$GITHUB_WORKSPACE/examples/onboarding/business-copilot-instructions.seed.md" \
               .github/copilot-instructions.md
            instructions_action="seeded"
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"
            echo "instructions_action=$instructions_action" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/skills/akr-business-consolidation/SKILL.md \
            .github/skills/akr-business-consolidation/SKILL-COMPAT.md \
            .github/skills/akr-business-consolidation/scripts/
          if [ "$instructions_action" = "seeded" ]; then
            git add .github/copilot-instructions.md
          fi
          git commit -m "chore(akr): distribute business skill bundle ${{ needs.prepare-matrix.outputs.release_tag }}"
          git push --set-upstream origin "$branch_name"

          echo "no_changes=false" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"
          echo "instructions_action=$instructions_action" >> "$GITHUB_OUTPUT"

      - name: Create or reuse PR
        id: pr
        if: steps.sync.outputs.no_changes != 'true'
        run: |
          set -euo pipefail
          cd target-repo
          existing_url=$(gh pr list \
            --head "${{ matrix.owner }}:${{ steps.sync.outputs.branch_name }}" \
            --json url --jq '.[0].url // ""')
          if [ -n "$existing_url" ]; then
            echo "pr_url=$existing_url" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          default_base=$(gh repo view "${{ matrix.owner }}/${{ matrix.repo }}" \
            --json defaultBranchRef --jq '.defaultBranchRef.name')

          pr_body=$'## AKR Business Skill Distribution - ${{ needs.prepare-matrix.outputs.release_tag }}\n\n### Files Updated\n- `.github/skills/akr-business-consolidation/SKILL.md`\n- `.github/skills/akr-business-consolidation/SKILL-COMPAT.md`\n- `.github/skills/akr-business-consolidation/scripts/capability-impact-analysis.md`\n- `.github/skills/akr-business-consolidation/scripts/capability-coverage-review.md`\n- `.github/skills/akr-business-consolidation/scripts/capability-relationship-mapping.md`\n- `.github/skills/akr-business-consolidation/scripts/capability-consolidation.md`\n- `.github/skills/akr-business-consolidation/scripts/capability-test-maintenance.md`\n- `.github/skills/akr-business-consolidation/scripts/capability-test-generation.md`\n\n### copilot-instructions handling\n- `.github/copilot-instructions.md`: ${{ steps.sync.outputs.instructions_action }}\n\n### Distribution scope\n- Included: business consolidation skill artifacts only\n- Excluded: app `akr-docs` artifacts, app hooks, and unrelated onboarding scaffolds\n\n### Reviewer Checklist\n- [ ] Skill dispatcher and all six mode scripts are present\n- [ ] Existing `.github/copilot-instructions.md` was preserved when present\n- [ ] No app-repo skill files were distributed'

          pr_url=$(gh pr create \
            --title "chore(akr): distribute business skill bundle ${{ needs.prepare-matrix.outputs.release_tag }}" \
            --body "$pr_body" \
            --base "$default_base" \
            --head "${{ matrix.owner }}:${{ steps.sync.outputs.branch_name }}")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Business Skill Distribution"
            echo "- Target: ${{ matrix.owner }}/${{ matrix.repo }}"
            echo "- Release tag: ${{ needs.prepare-matrix.outputs.release_tag }}"
            echo "- No changes: ${{ steps.sync.outputs.no_changes || 'unknown' }}"
            echo "- copilot-instructions action: ${{ steps.sync.outputs.instructions_action || 'unknown' }}"
            if [ -n "${{ steps.pr.outputs.pr_url }}" ]; then
              echo "- PR: ${{ steps.pr.outputs.pr_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
