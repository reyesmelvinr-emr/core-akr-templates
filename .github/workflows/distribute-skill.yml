name: Distribute AKR Skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Optional single target repo (owner/repo)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  prepare-matrix:
    name: Prepare Distribution Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3.6.0

      - name: Install matrix dependencies
        run: python -m pip install --no-cache-dir pyyaml

      - name: Determine release tag
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build matrix from registered repos
        id: matrix
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml

          registered = Path('.github/registered-repos.yaml')
          if not registered.exists():
            raise SystemExit('Missing .github/registered-repos.yaml')

          cfg = yaml.safe_load(registered.read_text(encoding='utf-8')) or {}
          repos = []
          for item in cfg.get('repositories', []):
            if item.get('enabled', True):
              owner = item.get('owner', '').strip()
              repo = item.get('repo', '').strip()
              if owner and repo:
                repos.append({'owner': owner, 'repo': repo})

          target = os.environ.get('INPUT_TARGET_REPO', '').strip()
          if target:
            if '/' not in target:
              raise SystemExit('workflow_dispatch target_repo must be owner/repo')
            owner, repo = target.split('/', 1)
            if not owner.strip() or not repo.strip():
              raise SystemExit('workflow_dispatch target_repo must be owner/repo')
            repos = [{'owner': owner.strip(), 'repo': repo.strip()}]

          if not repos:
            raise SystemExit('No target repositories enabled for distribution')

          payload = json.dumps({'include': repos})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
            fh.write(f'matrix={payload}\n')
          PY
        env:
          INPUT_TARGET_REPO: ${{ github.event.inputs.target_repo }}

  distribute:
    name: Distribute to ${{ matrix.owner }}/${{ matrix.repo }}
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ secrets.AKR_DISTRIBUTION_PAT }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v3.6.0

      - name: Validate required secret
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::AKR_DISTRIBUTION_PAT secret is not configured."
            exit 1
          fi

      - name: Validate target repository access
        run: |
          set -euo pipefail
          target="${{ matrix.owner }}/${{ matrix.repo }}"
          if ! gh repo view "$target" --json name > /dev/null 2>&1; then
            echo "::error::Repository '$target' not accessible with provided token."
            exit 1
          fi
          echo "Repository '$target' is accessible."

      - name: Clone target repository
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ matrix.owner }}/${{ matrix.repo }}.git" target-repo

      - name: Sync skill and hook bundle only
        id: sync
        run: |
          set -euo pipefail
          cd target-repo
          branch_name="akr-skill-update-${{ needs.prepare-matrix.outputs.release_tag }}"
          git checkout -B "$branch_name"

          # --- Distributed artifacts ---
          # These are the ONLY files this workflow distributes.
          # Vale rules and copilot-instructions are NOT distributed —
          # the CI validation workflow fetches them at runtime from core-akr-templates.

          mkdir -p .github/skills/akr-docs/scripts
          mkdir -p .github/hooks

          # Thin SKILL.md dispatcher
          cp "$GITHUB_WORKSPACE/.github/skills/akr-docs/SKILL.md" \
             .github/skills/akr-docs/SKILL.md

          # Compatibility matrix
          cp "$GITHUB_WORKSPACE/.github/skills/akr-docs/SKILL-COMPAT.md" \
             .github/skills/akr-docs/SKILL-COMPAT.md

          # Mode scripts — fetched by SKILL.md dispatcher at runtime,
          # but distributed here as PATH B/C fallbacks for offline/VS/CI use.
          cp "$GITHUB_WORKSPACE/.github/skills/akr-docs/scripts/akr-groupings.md" \
             .github/skills/akr-docs/scripts/akr-groupings.md
          cp "$GITHUB_WORKSPACE/.github/skills/akr-docs/scripts/akr-generate.md" \
             .github/skills/akr-docs/scripts/akr-generate.md
          cp "$GITHUB_WORKSPACE/.github/skills/akr-docs/scripts/akr-resolve.md" \
             .github/skills/akr-docs/scripts/akr-resolve.md
          cp "$GITHUB_WORKSPACE/.github/skills/akr-docs/scripts/akr-refresh-assets.md" \
             .github/skills/akr-docs/scripts/akr-refresh-assets.md
          cp "$GITHUB_WORKSPACE/.github/skills/akr-docs/scripts/akr-score.md" \
             .github/skills/akr-docs/scripts/akr-score.md

          # Inline validator — stdlib-only Python, no external deps.
          # Distributed so the generate step can invoke it immediately after writing.
          cp "$GITHUB_WORKSPACE/.github/skills/akr-docs/scripts/akr_inline_validate.py" \
             .github/skills/akr-docs/scripts/akr_inline_validate.py

          # Full canonical validator — distributed so agentStop hook can invoke
          # validate_documentation.py locally without requiring a core-akr-templates clone.
          cp "$GITHUB_WORKSPACE/.akr/scripts/validate_documentation.py" \
             .github/skills/akr-docs/scripts/validate_documentation.py

          # Hooks
          cp "$GITHUB_WORKSPACE/.github/hooks/postToolUse.json" \
             .github/hooks/postToolUse.json
          cp "$GITHUB_WORKSPACE/.github/hooks/agentStop.json" \
             .github/hooks/agentStop.json

          # NOTE: The following are intentionally NOT distributed:
          #   - validation/vale-rules/  → fetched at CI runtime from core-akr-templates
          #   - validation/.vale.ini    → fetched at CI runtime from core-akr-templates
          #   - .github/copilot-instructions.md → owned by application team, never overwritten

          if [ -z "$(git status --porcelain)" ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/skills/akr-docs/SKILL.md \
            .github/skills/akr-docs/SKILL-COMPAT.md \
            .github/skills/akr-docs/scripts/ \
            .github/hooks/postToolUse.json \
            .github/hooks/agentStop.json
          git commit -m "chore(akr): distribute skill bundle ${{ needs.prepare-matrix.outputs.release_tag }}"
          git push --set-upstream origin "$branch_name"

          echo "no_changes=false" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Create or reuse PR
        id: pr
        if: steps.sync.outputs.no_changes != 'true'
        run: |
          set -euo pipefail
          cd target-repo
          existing_url=$(gh pr list \
            --head "${{ matrix.owner }}:${{ steps.sync.outputs.branch_name }}" \
            --json url --jq '.[0].url // ""')
          if [ -n "$existing_url" ]; then
            echo "pr_url=$existing_url" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          default_base=$(gh repo view "${{ matrix.owner }}/${{ matrix.repo }}" \
            --json defaultBranchRef --jq '.defaultBranchRef.name')

          pr_body=$'## AKR Skill Distribution - ${{ needs.prepare-matrix.outputs.release_tag }}\n\n### Files Updated\n- `.github/skills/akr-docs/SKILL.md` - thin dispatcher (routes to mode scripts)\n- `.github/skills/akr-docs/SKILL-COMPAT.md` - model compatibility matrix\n- `.github/skills/akr-docs/scripts/akr-groupings.md` - ProposeGroupings mode script\n- `.github/skills/akr-docs/scripts/akr-generate.md` - GenerateDocumentation mode script\n- `.github/skills/akr-docs/scripts/akr-resolve.md` - ResolveUnknowns mode script\n- `.github/skills/akr-docs/scripts/akr-refresh-assets.md` - RefreshAssets mode script\n- `.github/skills/akr-docs/scripts/akr-score.md` - Score mode script\n- `.github/skills/akr-docs/scripts/akr_inline_validate.py` - inline post-generation validator (stdlib-only)\n- `.github/skills/akr-docs/scripts/validate_documentation.py` - full canonical validator (supports agentStop hook local execution)\n- `.github/hooks/postToolUse.json` - session logging hook\n- `.github/hooks/agentStop.json` - change detection hook\n\n### NOT Updated (by design)\n- `validation/vale-rules/` - fetched at CI runtime from core-akr-templates, no local copy needed\n- `validation/.vale.ini` - fetched at CI runtime, no local copy needed\n- `.github/copilot-instructions.md` - owned by application team, never overwritten by AKR\n\n### Reviewer Checklist\n- [ ] SKILL.md version header matches release tag\n- [ ] SKILL-COMPAT.md matrix is present and current\n- [ ] All five mode scripts are present under `.github/skills/akr-docs/scripts/`\n- [ ] `akr-score.md` is present under `.github/skills/akr-docs/scripts/`\n- [ ] `akr_inline_validate.py` is present under `.github/skills/akr-docs/scripts/`\n- [ ] `validate_documentation.py` is present under `.github/skills/akr-docs/scripts/`\n- [ ] Metadata canonical-format checks are present in `akr_inline_validate.py`\n- [ ] Hook files are valid JSON\n- [ ] CODEOWNERS protects `.github/skills/akr-docs/`'

          pr_url=$(gh pr create \
            --title "chore(akr): distribute skill bundle ${{ needs.prepare-matrix.outputs.release_tag }}" \
            --body "$pr_body" \
            --base "$default_base" \
            --head "${{ matrix.owner }}:${{ steps.sync.outputs.branch_name }}")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Write per-repo summary
        if: always()
        run: |
          set -euo pipefail
          echo "### ${{ matrix.owner }}/${{ matrix.repo }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.sync.outputs.no_changes }}" = "true" ]; then
            echo "- Status: no changes" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.pr.outputs.pr_url }}" ]; then
            echo "- Status: PR ready" >> "$GITHUB_STEP_SUMMARY"
            echo "- PR: ${{ steps.pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: failed before PR creation" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open follow-up issue on failure
        if: failure()
        run: |
          set -euo pipefail
          issue_title="Skill distribution failure: ${{ matrix.owner }}/${{ matrix.repo }}"
          issue_body="Distribution to ${{ matrix.owner }}/${{ matrix.repo }} failed in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$issue_title" \
            --body "$issue_body" || true

  distribution-summary:
    name: Distribution Summary
    runs-on: ubuntu-latest
    needs: [prepare-matrix, distribute]
    if: always()
    steps:
      - name: Final summary
        run: |
          set -euo pipefail
          echo "## AKR Skill Distribution" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release Tag: ${{ needs.prepare-matrix.outputs.release_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Matrix completion: ${{ needs.distribute.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Distributed: SKILL.md, SKILL-COMPAT.md, mode scripts (5), validators (2), hooks (2)" >> "$GITHUB_STEP_SUMMARY"
          echo "- NOT distributed: vale-rules, .vale.ini, copilot-instructions.md" >> "$GITHUB_STEP_SUMMARY"
