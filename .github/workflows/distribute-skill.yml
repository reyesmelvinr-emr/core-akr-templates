name: Distribute AKR Skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Optional single target repo (owner/repo)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  prepare-matrix:
    name: Prepare Distribution Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install matrix dependencies
        run: |
          python -m pip install --no-cache-dir pyyaml

      - name: Determine release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build matrix from registered repos
        id: matrix
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          registered = Path('.github/registered-repos.yaml')
          if not registered.exists():
            raise SystemExit('Missing .github/registered-repos.yaml')

          cfg = yaml.safe_load(registered.read_text(encoding='utf-8')) or {}
          repos = []
          for item in cfg.get('repositories', []):
            if item.get('enabled', True):
              owner = item.get('owner', '').strip()
              repo = item.get('repo', '').strip()
              if owner and repo:
                repos.append({'owner': owner, 'repo': repo})

          target = os.environ.get('INPUT_TARGET_REPO', '').strip()
          if target:
            if '/' not in target:
              raise SystemExit('workflow_dispatch target_repo must be owner/repo')
            owner, repo = target.split('/', 1)
            repos = [{'owner': owner.strip(), 'repo': repo.strip()}]

          if not repos:
            raise SystemExit('No target repositories enabled for distribution')

          payload = json.dumps({'include': repos})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
            fh.write(f'matrix={payload}\\n')
          PY
        env:
          INPUT_TARGET_REPO: ${{ github.event.inputs.target_repo }}

  distribute:
    name: Distribute to ${{ matrix.owner }}/${{ matrix.repo }}
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ secrets.AKR_DISTRIBUTION_PAT }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Validate required secret
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::AKR_DISTRIBUTION_PAT secret is not configured."
            echo "::error::Add a fine-grained or classic PAT with 'repo' scope as the AKR_DISTRIBUTION_PAT secret in this repository's settings."
            exit 1
          fi

      - name: Validate target repository access
        run: |
          target="${{ matrix.owner }}/${{ matrix.repo }}"
          if ! gh repo view "$target" --json name > /dev/null 2>&1; then
            echo "::error::Repository '$target' was not found or is not accessible with the provided token."
            echo "::error::Please verify:"
            echo "::error::  1. The repository exists at https://github.com/$target"
            echo "::error::  2. AKR_DISTRIBUTION_PAT has 'repo' scope and write access to '$target'"
            echo "::error::  3. The owner and repo name in .github/registered-repos.yaml are correct (names are case-sensitive)"
            exit 1
          fi
          echo "Repository '$target' is accessible."

      - name: Clone target repository
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ matrix.owner }}/${{ matrix.repo }}.git" target-repo

      - name: Sync skill + hook bundle
        id: sync
        run: |
          cd target-repo
          branch_name="akr-skill-update-${{ needs.prepare-matrix.outputs.release_tag }}"
          git checkout -B "$branch_name"

          mkdir -p .github/skills/akr-docs
          mkdir -p .github/hooks
          mkdir -p validation/vale-rules

          cp "$GITHUB_WORKSPACE/.github/skills/akr-docs/SKILL.md" .github/skills/akr-docs/SKILL.md
          cp "$GITHUB_WORKSPACE/.github/skills/akr-docs/SKILL-COMPAT.md" .github/skills/akr-docs/SKILL-COMPAT.md
          cp "$GITHUB_WORKSPACE/.github/hooks/postToolUse.json" .github/hooks/postToolUse.json
          cp "$GITHUB_WORKSPACE/.github/hooks/agentStop.json" .github/hooks/agentStop.json
          cp -r "$GITHUB_WORKSPACE/validation/vale-rules/." validation/vale-rules/
          cp "$GITHUB_WORKSPACE/validation/.vale.ini" validation/.vale.ini

          if [ -f "$GITHUB_WORKSPACE/.github/automated-skill-update.md" ]; then
            cp "$GITHUB_WORKSPACE/.github/automated-skill-update.md" /tmp/automated-skill-update.md
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/skills/akr-docs/SKILL.md .github/skills/akr-docs/SKILL-COMPAT.md .github/hooks/postToolUse.json .github/hooks/agentStop.json validation/vale-rules validation/.vale.ini
          git commit -m "chore(akr): distribute skill bundle ${{ needs.prepare-matrix.outputs.release_tag }}"
          git push --set-upstream origin "$branch_name"

          echo "no_changes=false" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Create or reuse PR
        id: pr
        if: steps.sync.outputs.no_changes != 'true'
        run: |
          cd target-repo
          existing_url=$(gh pr list --head "${{ steps.sync.outputs.branch_name }}" --json url --jq '.[0].url // ""')
          if [ -n "$existing_url" ]; then
            echo "pr_url=$existing_url" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          default_base=$(gh repo view "${{ matrix.owner }}/${{ matrix.repo }}" --json defaultBranchRef --jq '.defaultBranchRef.name')
          if [ -f /tmp/automated-skill-update.md ]; then
            pr_url=$(gh pr create --title "chore(akr): distribute skill bundle ${{ needs.prepare-matrix.outputs.release_tag }}" --body-file /tmp/automated-skill-update.md --base "$default_base" --head "${{ steps.sync.outputs.branch_name }}")
          else
            pr_url=$(gh pr create --title "chore(akr): distribute skill bundle ${{ needs.prepare-matrix.outputs.release_tag }}" --body "Automated AKR skill distribution update." --base "$default_base" --head "${{ steps.sync.outputs.branch_name }}")
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Write per-repo summary
        if: always()
        run: |
          echo "### ${{ matrix.owner }}/${{ matrix.repo }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.sync.outputs.no_changes }}" = "true" ]; then
            echo "- Status: no changes" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.pr.outputs.pr_url }}" ]; then
            echo "- Status: PR ready" >> "$GITHUB_STEP_SUMMARY"
            echo "- PR: ${{ steps.pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: failed before PR creation" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open follow-up issue on failure
        if: failure()
        run: |
          issue_title="Skill distribution failure: ${{ matrix.owner }}/${{ matrix.repo }}"
          issue_body="Distribution to ${{ matrix.owner }}/${{ matrix.repo }} failed in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.\n\nPlease investigate token access, repo permissions, and branch protection behavior."
          gh issue create --repo "${{ github.repository }}" --title "$issue_title" --body "$issue_body" || true

  distribution-summary:
    name: Distribution Summary
    runs-on: ubuntu-latest
    needs:
      - prepare-matrix
      - distribute
    if: always()
    steps:
      - name: Final summary
        run: |
          echo "## AKR Skill Distribution" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release Tag: ${{ needs.prepare-matrix.outputs.release_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Matrix completion: ${{ needs.distribute.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle includes: SKILL.md, SKILL-COMPAT.md, postToolUse.json, agentStop.json, validation/vale-rules/**, validation/.vale.ini" >> "$GITHUB_STEP_SUMMARY"
