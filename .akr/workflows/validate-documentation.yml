name: AKR Documentation Validation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - '.akr-config.json'
  push:
    branches:
      - main
    paths:
      - 'docs/**'

# Permissions for Checks API integration
permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  validate-documentation:
    name: Validate AKR Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git diff
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Clone core-akr-templates
        run: |
          mkdir -p ~/.akr
          git clone https://github.com/reyesmelvinr-emr/core-akr-templates ~/.akr/templates
          echo "✓ Templates cloned to ~/.akr/templates"
      
      - name: Install Vale
        run: |
          wget https://github.com/errata-ai/vale/releases/download/v2.29.0/vale_2.29.0_Linux_64-bit.tar.gz
          tar -xzf vale_2.29.0_Linux_64-bit.tar.gz
          sudo mv vale /usr/local/bin/
          vale --version
      
      - name: Install validation dependencies
        run: |
          pip install --no-cache-dir requests

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            docs/**/*.md
            src/**/*.{cs,ts,tsx,js,jsx,py}
      
      - name: Run Vale linter
        id: vale
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Running Vale on changed documentation files..."
          vale --config ~/.akr/templates/.akr/.vale.ini ${{ steps.changed-files.outputs.all_changed_files }} \
            --output=JSON > vale-results.json || true
          
          # Display results
          cat vale-results.json
          
          # Count errors
          ERRORS=$(jq '[.[] | select(.Severity == "error")] | length' vale-results.json)
          echo "vale_errors=$ERRORS" >> $GITHUB_OUTPUT
      
      - name: Run AKR validation
        id: akr-validation
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Running AKR documentation validator..."
          
          # Download validation script
          wget -O validate_documentation.py \
            https://raw.githubusercontent.com/reyesmelvinr-emr/core-akr-templates/main/scripts/validate_documentation.py
          
          # Run validation
          python validate_documentation.py --changed-files --output json > akr-results.json || true
          
          # Display results
          cat akr-results.json
          
          # Extract metrics
          TOTAL_ERRORS=$(jq '.summary.total_errors' akr-results.json)
          TOTAL_WARNINGS=$(jq '.summary.total_warnings' akr-results.json)
          AVG_COMPLETENESS=$(jq '.summary.average_completeness' akr-results.json)
          
          echo "akr_errors=$TOTAL_ERRORS" >> $GITHUB_OUTPUT
          echo "akr_warnings=$TOTAL_WARNINGS" >> $GITHUB_OUTPUT
          echo "completeness=$AVG_COMPLETENESS" >> $GITHUB_OUTPUT
      
      - name: Validate Traceability
        id: traceability
        continue-on-error: true  # Non-blocking validation
        run: |
          echo "Validating bidirectional links between feature and testing docs..."
          
          # Download validation script
          wget -O validate_traceability.py \
            https://raw.githubusercontent.com/reyesmelvinr-emr/akr-mcp-server/main/scripts/validation/validate_traceability.py
          
          # Run traceability validation
          python validate_traceability.py --docs-dir docs --json > traceability-results.json || true
          
          # Display results
          cat traceability-results.json
          
          # Extract metrics
          TRACE_ERRORS=$(jq '.errors | length' traceability-results.json)
          TRACE_WARNINGS=$(jq '.warnings | length' traceability-results.json)
          MATCHED_PAIRS=$(jq '.matched_pairs' traceability-results.json)
          
          echo "trace_errors=$TRACE_ERRORS" >> $GITHUB_OUTPUT
          echo "trace_warnings=$TRACE_WARNINGS" >> $GITHUB_OUTPUT
          echo "matched_pairs=$MATCHED_PAIRS" >> $GITHUB_OUTPUT
          
          # Create summary
          echo "Traceability Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Errors: $TRACE_ERRORS" >> $GITHUB_STEP_SUMMARY
          echo "- Warnings: $TRACE_WARNINGS" >> $GITHUB_STEP_SUMMARY
          echo "- Matched Pairs: $MATCHED_PAIRS" >> $GITHUB_STEP_SUMMARY
      
      - name: Analyze Documentation Impact
        id: impact
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Analyzing documentation impact for PR..."
          
          # Download impact analysis script
          wget -O analyze_doc_impact.py \
            https://raw.githubusercontent.com/reyesmelvinr-emr/akr-mcp-server/main/scripts/validation/analyze_doc_impact.py
          
          # Ensure PyYAML is installed
          pip install PyYAML
          
          # Get list of changed files
          echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' > changed-files.txt
          
          # Run impact analysis
          python analyze_doc_impact.py \
            --changed-files-file changed-files.txt \
            --docs-dir docs \
            --output json > impact-analysis.json || true
          
          # Also generate markdown comment
          python analyze_doc_impact.py \
            --changed-files-file changed-files.txt \
            --docs-dir docs \
            --output markdown > impact-comment.md || true
          
          # Display results
          cat impact-analysis.json
          
          # Extract metrics
          AFFECTED_TESTING=$(jq '.impact.affected_testing | length' impact-analysis.json)
          BROKEN_LINKS=$(jq '.impact.broken_links | length' impact-analysis.json)
          
          echo "affected_testing=$AFFECTED_TESTING" >> $GITHUB_OUTPUT
          echo "broken_links=$BROKEN_LINKS" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Check
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Load results
            const valeResults = JSON.parse(fs.readFileSync('vale-results.json', 'utf8'));
            const akrResults = JSON.parse(fs.readFileSync('akr-results.json', 'utf8'));
            
            // Calculate status
            const valeErrors = ${{ steps.vale.outputs.vale_errors || 0 }};
            const akrErrors = ${{ steps.akr-validation.outputs.akr_errors || 0 }};
            const totalErrors = valeErrors + akrErrors;
            
            const conclusion = totalErrors === 0 ? 'success' : 'failure';
            
            // Create check run
            const checkRun = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'AKR Documentation Validation',
              head_sha: context.payload.pull_request?.head?.sha || context.sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: totalErrors === 0 ? '✅ Documentation validation passed' : `❌ ${totalErrors} error(s) found`,
                summary: `
            ### Validation Summary
            
            - **Vale Errors:** ${valeErrors}
            - **AKR Errors:** ${akrErrors}
            - **AKR Warnings:** ${{ steps.akr-validation.outputs.akr_warnings || 0 }}
            - **Average Completeness:** ${{ steps.akr-validation.outputs.completeness || 0 }}%
            
            ${totalErrors === 0 ? '✅ All checks passed!' : '❌ Please fix errors before merging.'}
                `,
                annotations: [
                  // Add Vale annotations
                  ...Object.entries(valeResults).flatMap(([file, issues]) =>
                    issues.filter(i => i.Severity === 'error').map(issue => ({
                      path: file,
                      start_line: issue.Line,
                      end_line: issue.Line,
                      annotation_level: 'failure',
                      message: `[Vale/${issue.Check}] ${issue.Message}`
                    }))
                  ).slice(0, 50),  // GitHub limit: 50 annotations per request
                  
                  // Add AKR validation annotations
                  ...akrResults.results.flatMap(result =>
                    result.issues.filter(i => i.severity === 'error').map(issue => ({
                      path: result.file_path,
                      start_line: issue.line || 1,
                      end_line: issue.line || 1,
                      annotation_level: 'failure',
                      message: `[AKR/${issue.rule}] ${issue.message}`
                    }))
                  ).slice(0, 50)
                ]
              }
            });
            
            console.log(`Check run created: ${checkRun.data.html_url}`);
      
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const akrResults = JSON.parse(fs.readFileSync('akr-results.json', 'utf8'));
            let traceabilityResults = null;
            let impactAnalysis = null;
            let impactComment = '';
            try {
              traceabilityResults = JSON.parse(fs.readFileSync('traceability-results.json', 'utf8'));
            } catch (e) {
              // Traceability results not available
            }
            try {
              impactAnalysis = JSON.parse(fs.readFileSync('impact-analysis.json', 'utf8'));
              impactComment = fs.readFileSync('impact-comment.md', 'utf8');
            } catch (e) {
              // Impact analysis not available
            }
            
            const valeErrors = ${{ steps.vale.outputs.vale_errors || 0 }};
            const akrErrors = ${{ steps.akr-validation.outputs.akr_errors || 0 }};
            const akrWarnings = ${{ steps.akr-validation.outputs.akr_warnings || 0 }};
            const completeness = ${{ steps.akr-validation.outputs.completeness || 0 }};
            const traceErrors = ${{ steps.traceability.outputs.trace_errors || 0 }};
            const traceWarnings = ${{ steps.traceability.outputs.trace_warnings || 0 }};
            const matchedPairs = ${{ steps.traceability.outputs.matched_pairs || 0 }};
            const affectedTesting = ${{ steps.impact.outputs.affected_testing || 0 }};
            const brokenLinks = ${{ steps.impact.outputs.broken_links || 0 }};
            
            const status = (valeErrors + akrErrors) === 0 ? '✅' : '❌';
            const traceStatus = traceErrors === 0 ? '✅' : '⚠️';
            
            let comment = `
            ## ${status} AKR Documentation Validation
            
            | Metric | Value |
            |--------|-------|
            | **Vale Errors** | ${valeErrors} |
            | **AKR Errors** | ${akrErrors} |
            | **AKR Warnings** | ${akrWarnings} |
            | **Completeness** | ${(completeness * 100).toFixed(0)}% |
            | **Status** | ${(valeErrors + akrErrors) === 0 ? '✅ Pass' : '❌ Fail'} |
            `;
            
            // Add traceability section if available
            if (traceabilityResults) {
              comment += `
            
            ### ${traceStatus} Traceability Validation (Non-blocking)
            
            | Metric | Value |
            |--------|-------|
            | **Matched Pairs** | ${matchedPairs} |
            | **Errors** | ${traceErrors} |
            | **Warnings** | ${traceWarnings} |
            | **Status** | ${traceErrors === 0 ? '✅ Pass' : '⚠️ Issues Found'} |
            
            ${traceErrors > 0 ? `
            <details>
            <summary>🔗 <strong>Traceability Issues</strong></summary>
            
            ${traceabilityResults.errors.slice(0, 10).map(err => `- ❌ ${err}`).join('\n')}
            ${traceabilityResults.errors.length > 10 ? `\n...and ${traceabilityResults.errors.length - 10} more errors` : ''}
            
            </details>
            ` : ''}
            
            ${traceWarnings > 0 ? `
            <details>
            <summary>⚠️ <strong>Traceability Warnings</strong></summary>
            
            ${traceabilityResults.warnings.slice(0, 10).map(warn => `- ⚠️ ${warn}`).join('\n')}
            ${traceabilityResults.warnings.length > 10 ? `\n...and ${traceabilityResults.warnings.length - 10} more warnings` : ''}
            
            </details>
            ` : ''}
            `;
            }
            
            // Add impact analysis section if available
            if (impactComment) {
              comment += '\n' + impactComment + '\n';
            }
            
            comment += `
            ${akrResults.results.length > 0 ? `
            ### Detailed Results
            
            ${akrResults.results.map(result => `
            <details>
            <summary><strong>${result.valid ? '✅' : '❌'} ${result.file_path}</strong> (Completeness: ${(result.completeness_score * 100).toFixed(0)}%)</summary>
            
            ${result.issues.length > 0 ? result.issues.map(issue => {
              const icon = {error: '❌', warning: '⚠️', suggestion: '💡', info: 'ℹ️'}[issue.severity];
              return `- ${icon} **${issue.severity.toUpperCase()}** ${issue.line ? `(line ${issue.line})` : ''}: ${issue.message}`;
            }).join('\n') : 'No issues found'}
            
            </details>
            `).join('\n')}
            ` : ''}
            
            ---
            
            ${(valeErrors + akrErrors) === 0 ? 
              '✅ **All validation checks passed!** Documentation is ready for review.' : 
              '❌ **Please fix the errors above before merging.** See the Checks tab for detailed annotations.'}
            
            ${traceErrors > 0 ? '\n⚠️ **Note:** Traceability issues are non-blocking warnings. Consider addressing them to improve documentation quality.' : ''}
            
            <sub>Powered by AKR MCP Documentation Server</sub>
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const existingComment = comments.find(c => c.body.includes('AKR Documentation Validation'));
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
      
      - name: Log usage metrics
        if: always()
        run: |
          echo "📊 Logging GitHub Actions usage metrics..."
          
          # Calculate duration (approximation)
          START_TIME=$(date -d "${{ github.event.pull_request.created_at || github.event.head_commit.timestamp }}" +%s)
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          
          # Create usage log
          cat > usage-metrics.json <<EOF
          {
            "workflow_run_id": "${{ github.run_id }}",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "event": "${{ github.event_name }}",
            "duration_minutes": $MINUTES,
            "timestamp": "$(date -Iseconds)",
            "runner": "${{ runner.os }}",
            "validation_results": {
              "vale_errors": ${{ steps.vale.outputs.vale_errors || 0 }},
              "akr_errors": ${{ steps.akr-validation.outputs.akr_errors || 0 }},
              "akr_warnings": ${{ steps.akr-validation.outputs.akr_warnings || 0 }},
              "completeness": ${{ steps.akr-validation.outputs.completeness || 0 }}
            }
          }
          EOF
          
          cat usage-metrics.json
          
          echo "✓ Usage metrics logged"
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            vale-results.json
            akr-results.json
            usage-metrics.json
          retention-days: 30
      
      - name: Fail on errors
        if: steps.vale.outputs.vale_errors > 0 || steps.akr-validation.outputs.akr_errors > 0
        run: |
          echo "❌ Validation failed with errors"
          echo "Vale errors: ${{ steps.vale.outputs.vale_errors }}"
          echo "AKR errors: ${{ steps.akr-validation.outputs.akr_errors }}"
          exit 1
