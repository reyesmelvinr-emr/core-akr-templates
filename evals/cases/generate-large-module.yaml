id: generate-large-module
description: Stress-test documentation generation on large module with no truncation
token_budget: 14000
cost_regression_threshold: 1.2
inputs:
  command: /akr-docs generate EnrollmentDomain
assertions:
  - required_sections_present
  - no_truncation_markers
  - metadata_header_present
  - passes_completed_recorded
  - pass_split_allowed_when_needed
